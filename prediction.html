<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>loan prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.minn.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
  <body>
    <div class="bg-white">
      <header class="absolute inset-x-0 top-0 z-50 bg-white shadow-lg">
        <nav class="flex items-center justify-between p-8 lg:px-10 h-20" aria-label="Global">
          <div class="flex lg:flex-1">
            <a href="#" class="-m-1.5 p-2">
              <span class="sr-only">About us</span>
              <img class="h-10 w-auto" src="https://img.icons8.com/ios-filled/100/4CAF50/money--v1.png" alt="Loan System Logo">
            </a>
          </div>
          <div class="flex lg:hidden">
            <button type="button" class="-m-2.5 inline-flex items-center justify-center rounded-md p-3 text-gray-700">
              <span class="sr-only">Open main menu</span>
              <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
            </button>
          </div>
          <div class="hidden lg:flex lg:gap-x-14">
            <a href="{{ url_for('index') }}"
                class="text-lg font-semibold text-green-900 hover:text-green-700 transition-colors duration-200">
                Home
            </a>
          
            <a href="{{ url_for('predict') }}"
               class="text-lg font-semibold {{ 'border-b-2 border-green-900' if request.endpoint == 'predict' else 'text-green-900' }} hover:text-green-700 transition-colors duration-200">
               Prediction
            </a>
          
            <a href="{{ url_for('about') }}"
               class="text-lg font-semibold {{ 'border-b-2 border-green-900' if request.endpoint == 'about' else 'text-green-900' }} hover:text-green-700 transition-colors duration-200">
               About us
            </a>
          </div>
           <div class="hidden lg:flex lg:flex-1 lg:justify-end">
        </div>
      </nav>
    </header>
          <div class="max-w-2xl mx-auto px-6 sm:px-8 lg:px-10 mt-20">
              <div class="space-y-12 bg-white p-6 shadow-lg rounded-lg">
                <div class="border-b border-gray-300 pb-8">
                  <h2 class="text-lg font-semibold text-gray-900">Loan Prediction</h2>
                  <p class="mt-2 text-sm text-gray-600">
                    Fill the Form for prediction.
                  </p>
                </div>
              </div>
              <form action="{{ url_for('predict') }}" method="POST" class="mt-8">

                  <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
    <select class="form-select form-select-sm mb-3" id="gender" name="gender" aria-label=".form-select-lg example"required>
      <option selected>----select Gender----</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="married" class="form-label">Marriage status</label>
    <select class="form-select form-select-sm mb-3" id="married" name="married" aria-label=".form-select-lg example"required>
      <option selected>----select marriage status----</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="dependents" class="form-label">Dependents</label>
    <select class="form-select form-select-sm mb-3" id="dependents" name="dependents" aria-label=".form-select-lg example"required>
      <option selected>----select no of dependents----</option>
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3+">3+</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="education" class="form-label">Education</label>
    <select class="form-select form-select-sm mb-3" id="education" name="education" aria-label=".form-select-lg example"required>
      <option selected>----select Education----</option>
      <option value="Graduate">Graduate</option>
      <option value="Not Graduate">Not Graduate</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="employed" class="form-label">Self_Employed</label>
    <select class="form-select form-select-sm mb-3" id="employed" name="employed" aria-label=".form-select-lg example"required>
      <option selected>----select----</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="credit" class="form-label">Credit_History</label>
    <select class="form-select form-select-sm mb-3" id="credit" name="credit" aria-label=".form-select-lg example"required>
      <option selected>----select credit history----</option>
      <option value="0.000000">0.000000</option>
      <option value="0.842199">0.842199</option>
      <option value="1.000000">1.000000</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="area" class="form-label">Property_Area</label>
    <select class="form-select form-select-sm mb-3" id="area" name="area" aria-label=".form-select-lg example"required>
      <option selected>----select property area----</option>
      <option value="Rural">Rural</option>
      <option value="Urban">Urban</option>
      <option value="Semiurban">Semi-Urban</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="applicantIncome" class="form-label">Enter Applicant Income</label>
    <input type="text" class="form-control" id="applicantIncome" name="applicantIncome" placeholder="Applicant Income"required>
  </div>
  <div class="mb-3">
    <label for="coapplicantIncome" class="form-label">Enter Coapplicant Income</label>
    <input type="text" class="form-control" id="coapplicantIncome" name="coapplicantIncome" placeholder="Coapplicant Income"required>
  </div>
  
  <div class="mb-3">
    <label for="loanAmount" class="form-label">Enter Loan Amount</label>
    <input type="text" class="form-control" id="loanAmount" name="loanAmount" placeholder="Loan Amount"required>
  </div>
  <div class="mb-3">
    <label for="loanAmountTerm" class="form-label">Enter Loan Amount Term</label>
    <input type="text" class="form-control" id="loanAmountTerm" name="loanAmountTerm" placeholder="Loan Amount Term"required>
  </div>
  <div class="mb-3">
    <label for="totalIncome" class="form-label">Your TotalIncome is</label>
  <input type="text" class="form-control" id="totalIncome" name="TotalIncome" placeholder="Total Income" readonly>
  </div>
  <div class="container text-center mt-5 p-8 flex justify-center space-x-4">
    <button type="submit" class="bg-green-800 hover:bg-green-900 text-white font-semibold py-2 px-4 rounded">Predict</button>
  </div>
</form>
<a href="{{ url_for('suggestion') }}" id="nextButton" class="bg-blue-500 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded" style="display: none;">
    Next Page
</a>

<div>
  <br><br>
  <h3>{{ prediction_text }}</h3>
</div>
{% if shap_image %}
    <h3>Model Explanation:</h3>
    <img src="data:image/png;base64,{{ shap_image }}" alt="SHAP Explanation">
{% endif %}

</div>
 <!-- Total Income Calculator -->
<script>
    function updateTotalIncome() {
        const applicantIncome = parseFloat(document.getElementById("applicantIncome").value) || 0;
        const coapplicantIncome = parseFloat(document.getElementById("coapplicantIncome").value) || 0;
        const totalIncome = applicantIncome + coapplicantIncome;
        document.getElementById("totalIncome").value = totalIncome.toFixed(2);
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("applicantIncome").addEventListener("input", updateTotalIncome);
        document.getElementById("coapplicantIncome").addEventListener("input", updateTotalIncome);
    });
</script>
 <script>
    document.addEventListener("DOMContentLoaded", function () {
        const predictionText = document.querySelector("h3").innerText;
        const nextButton = document.getElementById("nextButton");

        if (predictionText.includes("Approved")) {
            nextButton.style.display = "inline-block";
        } else {
            nextButton.style.display = "none";
        }
    });
</script>

  </body>
</html>
