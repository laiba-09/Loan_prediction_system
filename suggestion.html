<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>loan Suggestion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.minn.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
  <body>
    
    <header class="absolute inset-x-0 top-0 z-50 bg-white shadow-lg">
      <nav class="flex items-center justify-between p-8 lg:px-10 h-20" aria-label="Global">
        <div class="flex lg:flex-1">
            <a href="#" class="-m-1.5 p-2">
                <span class="sr-only">About us</span>
                <img class="h-10 w-auto" src="https://img.icons8.com/ios-filled/100/4CAF50/money--v1.png" alt="Loan System Logo">
              </a>
              
        </div>
        
      </nav>
    </header>
    
          <div class="max-w-2xl mx-auto px-6 sm:px-8 lg:px-10 mt-20">
              <div class="space-y-12 bg-white p-6 shadow-lg rounded-lg">
                <div class="border-b border-gray-300 pb-8">
                  <h2 class="text-lg font-semibold text-gray-900">Loan Suggestion</h2>
                  <p class="mt-2 text-sm text-gray-600">
                    Fill the Form for suggestion of Loan Type.
                  </p>
                </div>
              </div>
              <form action="{{ url_for('suggestion') }}" method="POST"  class="mt-8">

                  <div class="mb-3">
                    <label for="married" class="form-label">Marriage status</label>
                    <select class="form-select form-select-sm mb-3"id='married' name='married' aria-label=".form-select-lg example"required>
                      <option selected>----select marriage status----</option>
                      <option value="1">Yes</option>
                      <option value="2">No</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="education" class="form-label">Education</label>
                    <select class="form-select form-select-sm mb-3"id='education' name='education' aria-label=".form-select-lg example"required>
                      <option selected>----select Education----</option>
                      <option value="1">Graduate</option>
                      <option value="2">Not Graduate</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="self_employed" class="form-label">Self_Employed</label>
                    <select class="form-select form-select-sm mb-3"id='employed' name='employed' aria-label=".form-select-lg example"required>
                      <option selected>----select----</option>
                      <option value="1">Yes</option>
                      <option value="2">No</option>
                    </select>
                  </div>
                  
                  <div class="mb-3">
                    <label for="property_area" class="form-label">Property_Area</label>
                    <select class="form-select form-select-sm mb-3"id='area' name='area' aria-label=".form-select-lg example"required>
                      <option selected>----select marriage status----</option>
                      <option value="1">Rural</option>
                      <option value="2">Urban</option>
                      <option value="3">Semi-Urban</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label for="TotalIncome" class="form-label">Total Income</label>
                    <input type="number" class="form-control" id="TotalIncome"name="TotalIncome" placeholder="Total_Income"required>
                  </div>
                  <div class="container text-center mt-5 p-8 flex justify-between items-center">
                    <div class="mt-10">
                        <a href="{{ url_for('index') }}" class="text-sm/6 font-bold text-green-900 **font-bold**">Back To Home Page <span aria-hidden="true">→</span></a>
                    </div>
                    <div>
                        <button type='submit' class="bg-green-800 hover:bg-green-900 text-white font-semibold py-2 px-4 rounded" type="submit">Suggest</button>
                    </div>
                </div>
          
        </form>
         {% if suggestion_text %}
        <p style="font-size: 2em; font-weight: bold;"> {{ suggestion_text }}</p>
    {% endif %}
     
          </div>
        
          
      
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
